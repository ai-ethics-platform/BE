name: diagnose

on:
  workflow_dispatch:

jobs:
  Inspect-EC2:
    runs-on: ubuntu-latest

    steps:
      - name: Create private key file from EC2_KEY
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Inspect containers on EC2 (read-only)
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: key.pem
          port: 22
          script: |
            echo "===== [1] compose version"
            docker-compose version 2>/dev/null | head -1 || echo "docker-compose (v1) not found"
            docker compose version 2>/dev/null | head -1 || echo "docker compose (v2) not found"

            echo "===== [2] running containers"
            docker ps

            echo "===== [3] all containers (including stopped)"
            docker ps -a

            echo "===== [4] networks"
            docker network ls

            echo "===== [5] backend containers: created / state / network aliases"
            for c in $(docker ps -aq --filter "name=backend"); do
              docker inspect --format '{{.Name}} | created={{.Created}} | state={{.State.Status}} | image={{.Config.Image}}' "$c"
              docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}    net={{$k}} ip={{$v.IPAddress}} aliases={{$v.Aliases}}{{"\n"}}{{end}}' "$c"
            done

            echo "===== [6] backend error logs (filtered)"
            for c in $(docker ps -aq --filter "name=backend"); do
              echo "--- container $c"
              docker logs --tail=200 "$c" 2>&1 | grep -iE "error|traceback|exception|refused|timed out|gone away|denied" | tail -20
            done

            echo "===== [9] recent custom_games codes (code + created_at only, no other fields)"
            docker exec ai_ethics_game-backend-1 python -c "
            import asyncio
            from sqlalchemy import select
            from app.core.database import async_session
            from app.models.custom_game import CustomGame

            async def main():
                async with async_session() as db:
                    result = await db.execute(
                        select(CustomGame.code, CustomGame.created_at)
                        .order_by(CustomGame.created_at.desc())
                        .limit(20)
                    )
                    for code, created_at in result.all():
                        print(f'{code}\t{created_at}')

            asyncio.run(main())
            " > /tmp/codes.txt 2>/dev/null
            grep -E $'^[^\t]+\t' /tmp/codes.txt > /tmp/codes_clean.txt
            cat /tmp/codes_clean.txt

            echo "===== [10] editor version classification per code (counts only, no raw log content)"
            for c in $(docker ps -aq --filter "name=backend"); do
              docker logs "$c" > /tmp/be_full.log 2>&1
              echo "total backend log lines available: $(wc -l < /tmp/be_full.log)"
              while IFS=$'\t' read -r code created; do
                [ -z "$code" ] && continue
                old_hits=$(grep -cE "\"PUT /custom-games/${code}/(opening|roles|dilemma|flips)" /tmp/be_full.log)
                new_hits=$(grep -cE "\"(PUT|POST) /custom-games/${code}/(representative-images|title)" /tmp/be_full.log)
                echo "code=${code} created=${created} old_version_hits=${old_hits} new_version_hits=${new_hits}"
              done < /tmp/codes_clean.txt
            done

            echo "===== [7] installed DB library versions"
            docker exec ai_ethics_game-backend-1 pip list 2>/dev/null | grep -iE "sqlalchemy|aiomysql|pymysql|greenlet" || echo "pip list failed"

            echo "===== [8] full pip freeze (for pinning reference)"
            docker exec ai_ethics_game-backend-1 pip freeze 2>/dev/null || echo "pip freeze failed"

            echo "===== done (nothing was changed)"
