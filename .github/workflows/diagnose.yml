name: diagnose

on:
  workflow_dispatch:

jobs:
  Inspect-EC2:
    runs-on: ubuntu-latest

    steps:
      - name: Create private key file from EC2_KEY
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Inspect containers on EC2 (read-only)
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: key.pem
          port: 22
          script: |
            echo "===== [1] compose version"
            docker-compose version 2>/dev/null | head -1 || echo "docker-compose (v1) not found"
            docker compose version 2>/dev/null | head -1 || echo "docker compose (v2) not found"

            echo "===== [2] running containers"
            docker ps

            echo "===== [3] all containers (including stopped)"
            docker ps -a

            echo "===== [4] networks"
            docker network ls

            echo "===== [5] backend containers: created / state / network aliases"
            for c in $(docker ps -aq --filter "name=backend"); do
              docker inspect --format '{{.Name}} | created={{.Created}} | state={{.State.Status}} | image={{.Config.Image}}' "$c"
              docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}    net={{$k}} ip={{$v.IPAddress}} aliases={{$v.Aliases}}{{"\n"}}{{end}}' "$c"
            done

            echo "===== [6] backend error logs (filtered)"
            for c in $(docker ps -aq --filter "name=backend"); do
              echo "--- container $c"
              docker logs --tail=200 "$c" 2>&1 | grep -iE "error|traceback|exception|refused|timed out|gone away|denied" | tail -20
            done

            echo "===== [7] installed DB library versions"
            docker exec ai_ethics_game-backend-1 pip list 2>/dev/null | grep -iE "sqlalchemy|aiomysql|pymysql|greenlet" || echo "pip list failed"

            echo "===== [8] full pip freeze (for pinning reference)"
            docker exec ai_ethics_game-backend-1 pip freeze 2>/dev/null || echo "pip freeze failed"

            echo "===== [9] backend DB target (safe)"
            docker exec ai_ethics_game-backend-1 python -c "
            from app.core.config import settings
            from sqlalchemy.engine import make_url
            u = make_url(settings.SQLALCHEMY_DATABASE_URI)
            print('DB_HOST =', u.host)
            print('DB_PORT =', u.port)
            print('DB_NAME =', u.database)
            "

            echo "===== [10] mysql network"
            docker inspect ai_ethics_game-mysql-1 \
              --format '{{range $k,$v := .NetworkSettings.Networks}}net={{$k}} ip={{$v.IPAddress}} aliases={{$v.Aliases}}{{"\n"}}{{end}}'

            echo "===== [11] mysql storage"
            docker inspect ai_ethics_game-mysql-1 \
              --format '{{range .Mounts}}{{.Type}} {{.Name}} -> {{.Destination}}{{"\n"}}{{end}}'
              
             echo "===== [12] production DB schema check (read-only)"
            docker exec -i ai_ethics_game-backend-1 python - <<'PY'
            import asyncio

            from sqlalchemy import text
            from app.core.database import engine


            async def main():
                async with engine.connect() as conn:
                    # 현재 연결된 DB 이름 확인
                    result = await conn.execute(
                        text("SELECT DATABASE()")
                    )
                    db_name = result.scalar()

                    print("CURRENT_DB =", db_name)

                    # Alembic 버전 테이블 존재 여부
                    result = await conn.execute(
                        text("""
                            SELECT COUNT(*)
                            FROM information_schema.tables
                            WHERE table_schema = DATABASE()
                              AND table_name = 'alembic_version'
                        """)
                    )

                    alembic_table_exists = result.scalar() > 0

                    print(
                        "ALEMBIC_VERSION_TABLE_EXISTS =",
                        alembic_table_exists
                    )

                    # Alembic 버전 확인
                    if alembic_table_exists:
                        result = await conn.execute(
                            text(
                                "SELECT version_num "
                                "FROM alembic_version"
                            )
                        )

                        versions = [
                            row[0]
                            for row in result.fetchall()
                        ]

                        print(
                            "ALEMBIC_VERSION =",
                            versions if versions else "EMPTY"
                        )

                    # users.is_admin 컬럼 존재 여부
                    result = await conn.execute(
                        text("""
                            SELECT
                                COLUMN_NAME,
                                COLUMN_TYPE,
                                IS_NULLABLE,
                                COLUMN_DEFAULT
                            FROM information_schema.columns
                            WHERE table_schema = DATABASE()
                              AND table_name = 'users'
                              AND column_name = 'is_admin'
                        """)
                    )

                    is_admin_column = result.first()

                    if is_admin_column:
                        print("USERS_IS_ADMIN_EXISTS = True")
                        print(
                            "USERS_IS_ADMIN_INFO =",
                            {
                                "column": is_admin_column[0],
                                "type": is_admin_column[1],
                                "nullable": is_admin_column[2],
                                "default": is_admin_column[3],
                            }
                        )
                    else:
                        print(
                            "USERS_IS_ADMIN_EXISTS = False"
                        )

                    # play_applications 테이블 존재 여부
                    result = await conn.execute(
                        text("""
                            SELECT COUNT(*)
                            FROM information_schema.tables
                            WHERE table_schema = DATABASE()
                              AND table_name = 'play_applications'
                        """)
                    )

                    play_table_exists = result.scalar() > 0

                    print(
                        "PLAY_APPLICATIONS_TABLE_EXISTS =",
                        play_table_exists
                    )

                    # 이미 테이블이 있다면 구조만 출력
                    if play_table_exists:
                        result = await conn.execute(
                            text("""
                                SELECT
                                    COLUMN_NAME,
                                    COLUMN_TYPE,
                                    IS_NULLABLE,
                                    COLUMN_DEFAULT
                                FROM information_schema.columns
                                WHERE table_schema = DATABASE()
                                  AND table_name = 'play_applications'
                                ORDER BY ORDINAL_POSITION
                            """)
                        )

                        print(
                            "PLAY_APPLICATIONS_COLUMNS ="
                        )

                        for row in result.fetchall():
                            print(
                                {
                                    "column": row[0],
                                    "type": row[1],
                                    "nullable": row[2],
                                    "default": row[3],
                                }
                            )

                await engine.dispose()


            asyncio.run(main())
            PY
            echo "===== done (nothing was changed)"