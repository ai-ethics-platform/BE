name: deploy

on:
  push:
    branches:
      - main

jobs:
  Deploy-to-EC2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create private key file from EC2_KEY
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Connect and deploy to EC2
        uses: appleboy/ssh-action@v0.1.5
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          GAME_DIAGNOSTIC_URL: ${{ secrets.GAME_DIAGNOSTIC_URL }}
          GAME_DIAGNOSTIC_API_KEY: ${{ secrets.GAME_DIAGNOSTIC_API_KEY }}
        with:
          envs: POSTHOG_PROJECT_TOKEN,GAME_DIAGNOSTIC_URL,GAME_DIAGNOSTIC_API_KEY
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: key.pem
          port: 22
          script: |
            set -e

            echo "[1] 프로젝트 이동 또는 클론"
            cd ~
            if [ -d "ai_ethics_game" ]; then
              cd ai_ethics_game
              git pull origin main
            else
              git clone https://github.com/ai-ethics-platform/BE.git ai_ethics_game
              cd ai_ethics_game
            fi

            echo "[2] .env 파일 생성 (base64 decode)"
            echo "${{ secrets.ENCODED_ENV_VARS }}" | base64 -d > .env
            printf '\nPOSTHOG_PROJECT_TOKEN=%s\n' "$POSTHOG_PROJECT_TOKEN" >> .env
            printf '\nGAME_DIAGNOSTIC_URL=%s\nGAME_DIAGNOSTIC_API_KEY=%s\n' "$GAME_DIAGNOSTIC_URL" "$GAME_DIAGNOSTIC_API_KEY" >> .env
            echo "[2-1] 업로드 이미지 볼륨 최초 이전"
            # 볼륨 도입 전 컨테이너 안에만 있던 이미지를 한 번만 호스트로 꺼낸다
            if [ ! -d uploads/images ]; then
              mkdir -p uploads
              BACKEND_ID=$(docker-compose ps -q backend || true)
              if [ -n "$BACKEND_ID" ]; then
                docker cp "$BACKEND_ID":/app/app/static/images uploads/images || true
              fi
              mkdir -p uploads/images
            fi

            echo "[3] Backend 빌드"
            docker-compose build backend

            echo "[4] DB migration 적용 후 Backend 교체"
            docker-compose run --rm --no-deps backend alembic upgrade head
            docker-compose up -d backend nginx
            docker-compose exec -T nginx nginx -t
            docker-compose exec -T nginx nginx -s reload

            echo "[5] 컨테이너 상태 확인"
            docker-compose ps

            echo "✅ Deployment completed!"
