name: deploy

on:
  push:
    branches:
      - main

jobs:
  Deploy-to-EC2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create private key file from EC2_KEY
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Connect and deploy to EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: key.pem
          port: 22
          script: |
            set -e

            echo "[1] 프로젝트 이동 또는 클론"
            cd ~
            if [ -d "ai_ethics_game" ]; then
              cd ai_ethics_game
              git pull origin main
            else
              git clone https://github.com/ai-ethics-platform/BE.git ai_ethics_game
              cd ai_ethics_game
            fi

            echo "[2] .env 파일 생성 (base64 decode)"
            echo "${{ secrets.ENCODED_ENV_VARS }}" | base64 -d > .env

            echo "[3] Docker 재시작 및 빌드"
            docker-compose down || true
            docker system prune -af
            docker-compose up -d --build

            echo "[4] DB migration 적용"
            docker-compose exec -T backend alembic upgrade head

            echo "[5] 최초 관리자 계정 지정"
            docker-compose exec -T backend python - <<'PY'
            import asyncio
            from sqlalchemy import select
            from app.core.database import async_session
            from app.models.user import User

            async def main():
                async with async_session() as db:
                    result = await db.execute(
                        select(User).where(User.username == "en_test03")
                    )
                    user = result.scalar_one_or_none()

                    if user is None:
                        raise RuntimeError("en_test03 계정을 찾을 수 없습니다.")

                    print(f"before: username={user.username}, is_admin={user.is_admin}")

                    user.is_admin = True
                    await db.commit()
                    await db.refresh(user)

                    print(f"after: username={user.username}, is_admin={user.is_admin}")

            asyncio.run(main())
            PY

            echo "[6] 컨테이너 상태 확인"
            docker-compose ps

            echo "✅ Deployment completed!"